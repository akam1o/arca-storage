name: OpenStack Python Tests

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      # OpenStack Cinder 28 requires Python 3.10 or newer.
      matrix:
        python-version:
          - '3.10'
          - '3.11'
          - '3.12'

    steps:
      - uses: actions/checkout@v4
        with:
          # setuptools-scm derives versions from Git tags (e.g. v0.2.7).
          fetch-depth: 0

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'
          cache-dependency-path: |
            arca_storage/test-requirements.txt
            arca_storage/tests/openstack/cinder/test-requirements.txt
            arca_storage/tests/openstack/manila/test-requirements.txt

      - name: Build sdist and wheel
        working-directory: ./arca_storage
        run: |
          python -m pip install --upgrade pip
          python -m pip install build
          python -m build --sdist --wheel
          echo "=== dist tree ==="
          ls -l dist

      - name: Install package and OpenStack test deps
        working-directory: ./arca_storage
        run: |
          python -m pip install dist/*.tar.gz
          python -m pip install -r tests/openstack/cinder/test-requirements.txt
          python -m pip install -r tests/openstack/manila/test-requirements.txt

      - name: Run OpenStack tests with pytest
        run: |
          # Copy tests and config to a temp directory to avoid importing from source
          cp -r arca_storage/tests /tmp/tests
          cp arca_storage/pytest.ini /tmp/pytest.ini
          cd /tmp
          python -m pytest tests/openstack -v -m "not slow" --cov=arca_storage --cov-report=xml:coverage-openstack.xml --cov-report=term
          # Copy coverage results back
          cp coverage-openstack.xml $GITHUB_WORKSPACE/arca_storage/

      - name: Upload OpenStack coverage reports
        if: matrix.python-version == '3.10'
        uses: codecov/codecov-action@v4
        with:
          file: ./arca_storage/coverage-openstack.xml
          flags: openstack
          name: codecov-openstack
        continue-on-error: true
