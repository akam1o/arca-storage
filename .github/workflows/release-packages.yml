name: Release Packages

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  debs:
    uses: ./.github/workflows/deb-build.yml
    with:
      version: ${{ github.event.release.tag_name }}

  el9:
    uses: ./.github/workflows/rpm-build.yml
    with:
      el: "9"
      version: ${{ github.event.release.tag_name }}

  el10:
    uses: ./.github/workflows/rpm-build.yml
    with:
      version: ${{ github.event.release.tag_name }}

  upload-to-release:
    runs-on: ubuntu-latest
    needs: [debs, el9, el10]
    if: always()
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: "*-debs"
          path: dist
          merge-multiple: true
      - uses: actions/download-artifact@v4
        if: needs.el9.result == 'success'
        with:
          name: el9-rpms
          path: dist
      - uses: actions/download-artifact@v4
        if: needs.el10.result == 'success'
        with:
          name: el10-rpms
          path: dist
      - name: Upload assets to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          fail_on_unmatched_files: false
          files: |
            dist/*.deb
            dist/*.changes
            dist/*.buildinfo
            dist/*.noarch.rpm
            dist/*.x86_64.rpm
            dist/*.src.rpm
