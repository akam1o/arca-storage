name: Release Packages

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  debs:
    uses: ./.github/workflows/deb-build.yml
    with:
      version: ${{ github.event.release.tag_name }}

  el9:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build rpms (EL9)
        run: |
          docker run --rm \
            -e "ARCA_VERSION=${{ github.event.release.tag_name }}" \
            -v "$GITHUB_WORKSPACE:/workspace" \
            -w /workspace \
            rockylinux:9 \
            bash -lc '
              dnf -y install git tar gzip rsync rpm-build python3 python3-pip &&
              git config --global --add safe.directory /workspace &&
              rm -rf packaging/wheelhouse &&
              bash ./packaging/vendor-wheels.sh &&
              bash ./packaging/build-rpm.sh
            '
      - name: Upload rpm artifacts
        uses: actions/upload-artifact@v4
        with:
          name: el9-rpms
          path: packaging/out/rpm/*

  el10:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build rpms (EL10)
        run: |
          docker run --rm \
            -e "ARCA_VERSION=${{ github.event.release.tag_name }}" \
            -v "$GITHUB_WORKSPACE:/workspace" \
            -w /workspace \
            rockylinux/rockylinux:10 \
            bash -lc '
              dnf -y install git tar gzip rsync rpm-build python3 python3-pip &&
              git config --global --add safe.directory /workspace &&
              rm -rf packaging/wheelhouse &&
              bash ./packaging/vendor-wheels.sh &&
              bash ./packaging/build-rpm.sh
            '
      - name: Upload rpm artifacts
        uses: actions/upload-artifact@v4
        with:
          name: el10-rpms
          path: packaging/out/rpm/*

  upload-to-release:
    runs-on: ubuntu-latest
    needs: [debs, el9, el10]
    if: always()
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: "*-debs"
          path: dist
          merge-multiple: true
      - uses: actions/download-artifact@v4
        if: needs.el9.result == 'success'
        with:
          name: el9-rpms
          path: dist
      - uses: actions/download-artifact@v4
        if: needs.el10.result == 'success'
        with:
          name: el10-rpms
          path: dist
      - name: Upload assets to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          fail_on_unmatched_files: false
          files: |
            dist/*.deb
            dist/*.changes
            dist/*.buildinfo
            dist/*.noarch.rpm
            dist/*.x86_64.rpm
            dist/*.src.rpm
