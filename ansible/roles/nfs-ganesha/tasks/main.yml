---
- name: Validate NFS-Ganesha inputs
  ansible.builtin.assert:
    that:
      - nfs_ganesha_config_dir is string
      - (nfs_ganesha_config_dir | string) is match('^/(?!$)(?!.*(^|/)\.\.?($|/))[A-Za-z0-9._/+:-]+$')
      - nfs_ganesha_export_dir is string
      - (nfs_ganesha_export_dir | string) is match('^/(?!$)(?!.*(^|/)\.\.?($|/))[A-Za-z0-9._/+:-]+$')
      - (nfs_ganesha_export_id | string) is match('^[1-9][0-9]{0,9}$')
      - nfs_ganesha_protocols is sequence
      - nfs_ganesha_protocols is not string
      - (nfs_ganesha_protocols | length) > 0
      - (nfs_ganesha_protocols | map('int') | difference([3, 4]) | list | length) == 0
      - nfs_ganesha_transports is sequence
      - nfs_ganesha_transports is not string
      - (nfs_ganesha_transports | length) > 0
      - (nfs_ganesha_transports | reject('match', '^(TCP|UDP)$') | list | length) == 0
      - (nfs_ganesha_mountd_port | string) is match('^[1-9][0-9]{0,4}$')
      - (nfs_ganesha_mountd_port | int) <= 65535
      - (nfs_ganesha_nlm_port | string) is match('^[1-9][0-9]{0,4}$')
      - (nfs_ganesha_nlm_port | int) <= 65535
      - nfs_ganesha_tenants is sequence
      - nfs_ganesha_tenants is not string
      - (nfs_ganesha_tenants | length) > 0
      - (nfs_ganesha_tenants | reject('match', '^[A-Za-z0-9][A-Za-z0-9._-]{0,63}$') | list | length) == 0
      - >-
        (nfs_ganesha_export_clients | string) is match('^(?:[0-9]{1,3}(?:\.[0-9]{1,3}){3}/[0-9]{1,2}|[0-9A-Fa-f:]+/[0-9]{1,3})(?:\s*,\s*(?:[0-9]{1,3}(?:\.[0-9]{1,3}){3}/[0-9]{1,2}|[0-9A-Fa-f:]+/[0-9]{1,3}))*$')
    fail_msg: >-
      NFS-Ganesha inputs must use safe absolute paths, valid protocol/transport
      values, safe tenant names, and CIDR-only export clients.

- name: Install NFS-Ganesha packages
  ansible.builtin.package:
    name: "{{ nfs_ganesha_packages }}"
    state: present

- name: Enable and start rpcbind service
  ansible.builtin.service:
    name: rpcbind
    state: started
    enabled: true
  when: nfs_ganesha_enable_v3 | bool

- name: Ensure export directory exists
  ansible.builtin.file:
    path: "{{ nfs_ganesha_export_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Ensure NFS-Ganesha config directory exists
  ansible.builtin.file:
    path: "{{ nfs_ganesha_config_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Ensure Arca Storage config directory exists
  ansible.builtin.file:
    path: /etc/arca-storage
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Render Arca Ganesha systemd environment
  ansible.builtin.copy:
    dest: /etc/arca-storage/arca-storage.env
    owner: root
    group: root
    mode: "0644"
    content: |
      # Managed by Ansible (derived from nfs_ganesha_config_dir)
      ARCA_GANESHA_CONFIG_DIR={{ nfs_ganesha_config_dir }}
  notify: Reload systemd

- name: Render NFS-Ganesha configuration
  ansible.builtin.template:
    src: ganesha.conf.j2
    dest: "{{ nfs_ganesha_config_dir }}/ganesha.conf"
    owner: root
    group: root
    mode: "0644"
  notify: Restart NFS-Ganesha

- name: Install NFS-Ganesha systemd unit template
  ansible.builtin.template:
    src: nfs-ganesha.service.j2
    dest: /etc/systemd/system/nfs-ganesha@.service
    owner: root
    group: root
    mode: "0644"
  notify: Reload systemd

- name: Install host-namespace NFS-Ganesha systemd unit template
  ansible.builtin.template:
    src: nfs-ganesha-host.service.j2
    dest: /etc/systemd/system/nfs-ganesha-host@.service
    owner: root
    group: root
    mode: "0644"
  notify: Reload systemd

- name: Render per-tenant NFS-Ganesha configuration
  ansible.builtin.template:
    src: ganesha.conf.j2
    dest: "{{ nfs_ganesha_config_dir }}/ganesha.{{ item }}.conf"
    owner: root
    group: root
    mode: "0644"
  loop: "{{ nfs_ganesha_tenants | default(['tenant_a']) }}"
  vars:
    svm_name: "{{ item }}"
  notify: Restart NFS-Ganesha
  when: nfs_ganesha_render_tenant_configs | default(false) | bool
