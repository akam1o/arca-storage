---
- name: Validate Pacemaker cluster identifiers
  ansible.builtin.assert:
    that:
      - pacemaker_cluster_name is string
      - (pacemaker_cluster_name | string | length) > 0
      - (pacemaker_cluster_name | string) is match('^[A-Za-z0-9][A-Za-z0-9._-]{0,63}$')
      - pacemaker_nodes is sequence
      - (pacemaker_nodes | length) >= 2
      - (pacemaker_nodes | map(attribute='name') | select('defined') | list | length) == (pacemaker_nodes | length)
      - (pacemaker_nodes | map(attribute='name') | select('string') | list | length) == (pacemaker_nodes | length)
      - >-
        (pacemaker_nodes | map(attribute='name') | select('defined') | select('string') | reject('match',
        '^[A-Za-z0-9](?:[A-Za-z0-9-]{0,61}[A-Za-z0-9])?(?:\.[A-Za-z0-9](?:[A-Za-z0-9-]{0,61}[A-Za-z0-9])?)*$') | list | length) == 0
      - (pacemaker_nodes | map(attribute='name') | select('defined') | select('string') | reject('match', '^.{254,}$') | list | length) == 0
      - (pacemaker_nodes | map(attribute='name') | unique | list | length) == (pacemaker_nodes | length)
    fail_msg: >-
      pacemaker_cluster_name must be a single safe path component, and pacemaker_nodes
      must contain at least two unique DNS hostnames.

- name: Validate Pacemaker RA vendor
  ansible.builtin.assert:
    that:
      - pacemaker_ra_vendor is string
      - (pacemaker_ra_vendor | string | length) > 0
      - (pacemaker_ra_vendor | string) is match('^[A-Za-z0-9][A-Za-z0-9._-]{0,63}$')
    fail_msg: >-
      pacemaker_ra_vendor must be a single safe path component that starts with an
      alphanumeric character and contains only alphanumeric characters, dots,
      underscores, or hyphens.

- name: Install Pacemaker packages
  ansible.builtin.package:
    name: "{{ pacemaker_packages }}"
    state: present

- name: Ensure hacluster user password is set
  ansible.builtin.user:
    name: hacluster
    password: "{{ pacemaker_hacluster_password | password_hash('sha512', pacemaker_hacluster_password_salt) }}"
    update_password: on_create

- name: Enable and start pcsd
  ansible.builtin.service:
    name: pcsd
    state: started
    enabled: true

# Bootstrap cluster once from a designated node to avoid race conditions.
- name: Bootstrap Pacemaker cluster configuration
  run_once: true
  delegate_to: "{{ pacemaker_cluster_bootstrap_node | default(pacemaker_nodes[0].name) }}"
  block:
    - name: Authenticate nodes for pcs
      ansible.builtin.command:
        argv: >-
          {{
            ['pcs', 'host', 'auth']
            + (pacemaker_nodes | map(attribute='name') | list)
            + ['-u', 'hacluster']
          }}
      args:
        stdin: "{{ pacemaker_hacluster_password }}"
      register: pacemaker_pcs_host_auth
      no_log: true
      changed_when: pacemaker_pcs_host_auth.stdout is search("Authorized")

    - name: Check existing cluster authkey
      ansible.builtin.stat:
        path: /etc/corosync/authkey
      register: pacemaker_authkey

    - name: Create cluster configuration if missing
      ansible.builtin.command:
        argv: >-
          {{
            ['pcs', 'cluster', 'setup', '--name', pacemaker_cluster_name]
            + (pacemaker_nodes | map(attribute='name') | list)
          }}
      when: not pacemaker_authkey.stat.exists
      register: pacemaker_pcs_cluster_setup
      changed_when: pacemaker_pcs_cluster_setup.rc == 0
  rescue:
    - name: Report Pacemaker bootstrap failure
      ansible.builtin.fail:
        msg: "Pacemaker cluster bootstrap failed. Check pcs authentication, corosync configuration, and node connectivity."

- name: Ensure Corosync configuration
  ansible.builtin.template:
    src: corosync.conf.j2
    dest: /etc/corosync/corosync.conf
    owner: root
    group: root
    mode: "0644"
  notify: Restart Corosync

- name: Ensure custom RA vendor directory
  ansible.builtin.file:
    path: "/usr/lib/ocf/resource.d/{{ pacemaker_ra_vendor }}"
    state: directory
    owner: root
    group: root
    mode: "0755"
  when: pacemaker_custom_ra | length > 0 or pacemaker_install_netnsvlan_ra | default(true) | bool

- name: Install custom RA scripts
  ansible.builtin.copy:
    src: "{{ item }}"
    dest: "/usr/lib/ocf/resource.d/{{ pacemaker_ra_vendor }}/{{ item | basename }}"
    owner: root
    group: root
    mode: "0755"
  loop: "{{ pacemaker_custom_ra }}"
  when: pacemaker_custom_ra | length > 0

- name: Install NetnsVlan resource agent
  ansible.builtin.copy:
    src: "{{ pacemaker_netnsvlan_ra_src }}"
    dest: "/usr/lib/ocf/resource.d/{{ pacemaker_ra_vendor }}/NetnsVlan"
    owner: root
    group: root
    mode: "0755"
  when: pacemaker_install_netnsvlan_ra | default(true) | bool

- name: Enable and start Corosync
  ansible.builtin.service:
    name: corosync
    state: started
    enabled: true

- name: Enable and start Pacemaker
  ansible.builtin.service:
    name: pacemaker
    state: started
    enabled: true

# Ensure cluster services are running and properties are applied once.
- name: Start Pacemaker cluster services
  run_once: true
  delegate_to: "{{ pacemaker_cluster_bootstrap_node | default(pacemaker_nodes[0].name) }}"
  block:
    - name: Start cluster on all nodes
      ansible.builtin.command:
        argv:
          - pcs
          - cluster
          - start
          - --all
      register: pacemaker_pcs_cluster_start
      changed_when: pacemaker_pcs_cluster_start.stdout is not search("already running")

    - name: Enable cluster to start on boot
      ansible.builtin.command:
        argv:
          - pcs
          - cluster
          - enable
          - --all
      register: pacemaker_pcs_cluster_enable
      changed_when: pacemaker_pcs_cluster_enable.stdout is not search("already enabled")

    - name: Ensure STONITH property matches desired state
      ansible.builtin.command:
        argv:
          - pcs
          - property
          - show
          - stonith-enabled
      register: pacemaker_pcs_stonith_property
      changed_when: false
      failed_when: false

    - name: Configure STONITH enabled property
      ansible.builtin.command:
        argv:
          - pcs
          - property
          - set
          - "stonith-enabled={{ pacemaker_enable_stonith | default(false) | bool | ternary('true', 'false') }}"
      when: >-
        (pacemaker_enable_stonith | default(false) | bool and 'stonith-enabled: true' not in pacemaker_pcs_stonith_property.stdout) or
        (not (pacemaker_enable_stonith | default(false) | bool) and 'stonith-enabled: false' not in pacemaker_pcs_stonith_property.stdout)
      register: pacemaker_pcs_stonith_set
      changed_when: pacemaker_pcs_stonith_set.rc == 0
  rescue:
    - name: Report Pacemaker service startup failure
      ansible.builtin.fail:
        msg: "Pacemaker cluster start/enable failed. Verify corosync health and node connectivity."

- name: Include resource creation tasks
  ansible.builtin.include_tasks: resources.yml
  when: pacemaker_create_resources | default(true) | bool
