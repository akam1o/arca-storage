---
# Create Pacemaker resources for Arca Storage
# This file is included from main.yml after cluster is started

- name: Validate Pacemaker resource inputs
  ansible.builtin.assert:
    that:
      - drbd_resource_name is string
      - (drbd_resource_name | string) is match('^[A-Za-z0-9][A-Za-z0-9._-]{0,63}$')
      - >-
        (pacemaker_fs_device | default('/dev/' ~ lvm_vg_name ~ '/' ~ (lvm_thin_volume_name | default('vol_tenant_a'))) | string)
        is match('^/dev/(?!.*(^|/)\.\.?($|/))[A-Za-z0-9._/+:-]+$')
      - >-
        (pacemaker_fs_directory | default('/exports/tenant_a') | string)
        is match('^/(?!$)(?!.*(^|/)\.\.?($|/))[A-Za-z0-9._/+:-]+$')
      - (pacemaker_netnsvlan_ns | default('tenant_a') | string) is match('^[A-Za-z0-9][A-Za-z0-9._-]{0,63}$')
      - (pacemaker_netnsvlan_vlan_id | default(100) | string) is match('^[0-9]{1,4}$')
      - (pacemaker_netnsvlan_vlan_id | default(100) | int) >= 1
      - (pacemaker_netnsvlan_vlan_id | default(100) | int) <= 4094
      - (pacemaker_netnsvlan_parent_if | default('bond0') | string) is match('^[A-Za-z0-9][A-Za-z0-9_.:@-]{0,63}$')
      - >-
        (pacemaker_netnsvlan_ip | default('192.168.10.5') | string)
        is match('^(?:(?:25[0-5]|2[0-4][0-9]|1?[0-9]?[0-9])\.){3}(?:25[0-5]|2[0-4][0-9]|1?[0-9]?[0-9])$')
      - (pacemaker_netnsvlan_prefix | default(24) | string) is match('^[0-9]{1,2}$')
      - (pacemaker_netnsvlan_prefix | default(24) | int) >= 1
      - (pacemaker_netnsvlan_prefix | default(24) | int) <= 32
      - >-
        (pacemaker_netnsvlan_gw | default('192.168.10.1') | string)
        is match('^(?:(?:25[0-5]|2[0-4][0-9]|1?[0-9]?[0-9])\.){3}(?:25[0-5]|2[0-4][0-9]|1?[0-9]?[0-9])$')
      - (pacemaker_netnsvlan_mtu | default(9000) | string) is match('^[0-9]{2,5}$')
      - (pacemaker_netnsvlan_mtu | default(9000) | int) >= 68
      - (pacemaker_netnsvlan_mtu | default(9000) | int) <= 65535
      - (pacemaker_ganesha_instance | default('tenant_a') | string) is match('^[A-Za-z0-9][A-Za-z0-9._-]{0,63}$')
    fail_msg: >-
      Pacemaker resource inputs must use safe resource names, /dev devices,
      absolute export paths, IPv4 network settings, and safe systemd instance names.

- name: Check if DRBD master resource exists
  ansible.builtin.command:
    argv:
      - pcs
      - resource
      - show
      - p_drbd_r0
  register: pacemaker_drbd_resource_check
  changed_when: false
  failed_when: false
  run_once: true
  delegate_to: "{{ pacemaker_cluster_bootstrap_node | default(pacemaker_nodes[0].name) }}"

- name: Create DRBD master resource
  when: pacemaker_drbd_resource_check.rc != 0
  run_once: true
  delegate_to: "{{ pacemaker_cluster_bootstrap_node | default(pacemaker_nodes[0].name) }}"
  block:
    - name: Create DRBD resource
      ansible.builtin.command:
        argv:
          - pcs
          - resource
          - create
          - p_drbd_r0
          - ocf:linbit:drbd
          - "drbd_resource={{ drbd_resource_name }}"
          - op
          - monitor
          - interval=15s
          - role=Master
      register: pacemaker_pcs_drbd_create
      changed_when: pacemaker_pcs_drbd_create.rc == 0

    - name: Create DRBD master resource group
      ansible.builtin.command:
        argv:
          - pcs
          - resource
          - master
          - ms_drbd_r0
          - p_drbd_r0
          - master-max=1
          - master-node-max=1
          - clone-max=2
          - clone-node-max=1
      register: pacemaker_pcs_drbd_master
      changed_when: pacemaker_pcs_drbd_master.rc == 0

- name: Check if Filesystem resource exists
  ansible.builtin.command:
    argv:
      - pcs
      - resource
      - show
      - fs_tenant_a
  register: pacemaker_fs_resource_check
  changed_when: false
  failed_when: false
  run_once: true
  delegate_to: "{{ pacemaker_cluster_bootstrap_node | default(pacemaker_nodes[0].name) }}"

- name: Create Filesystem resource
  ansible.builtin.command:
    argv:
      - pcs
      - resource
      - create
      - fs_tenant_a
      - ocf:heartbeat:Filesystem
      - "device={{ pacemaker_fs_device | default('/dev/' ~ lvm_vg_name ~ '/' ~ (lvm_thin_volume_name | default('vol_tenant_a'))) }}"
      - "directory={{ pacemaker_fs_directory | default('/exports/tenant_a') }}"
      - fstype=xfs
      - op
      - monitor
      - interval=10s
  register: pacemaker_pcs_fs_create
  changed_when: pacemaker_pcs_fs_create.rc == 0
  when: pacemaker_fs_resource_check.rc != 0
  run_once: true
  delegate_to: "{{ pacemaker_cluster_bootstrap_node | default(pacemaker_nodes[0].name) }}"

- name: Check if NetnsVlan resource exists
  ansible.builtin.command:
    argv:
      - pcs
      - resource
      - show
      - netns_tenant_a
  register: pacemaker_netns_resource_check
  changed_when: false
  failed_when: false
  run_once: true
  delegate_to: "{{ pacemaker_cluster_bootstrap_node | default(pacemaker_nodes[0].name) }}"

- name: Create NetnsVlan resource
  ansible.builtin.command:
    argv:
      - pcs
      - resource
      - create
      - netns_tenant_a
      - "ocf:{{ pacemaker_ra_vendor }}:NetnsVlan"
      - "ns={{ pacemaker_netnsvlan_ns | default('tenant_a') }}"
      - "vlan_id={{ pacemaker_netnsvlan_vlan_id | default(100) }}"
      - "parent_if={{ pacemaker_netnsvlan_parent_if | default('bond0') }}"
      - "ip={{ pacemaker_netnsvlan_ip | default('192.168.10.5') }}"
      - "prefix={{ pacemaker_netnsvlan_prefix | default(24) }}"
      - "gw={{ pacemaker_netnsvlan_gw | default('192.168.10.1') }}"
      - "mtu={{ pacemaker_netnsvlan_mtu | default(9000) }}"
      - op
      - monitor
      - interval=10s
  register: pacemaker_pcs_netns_create
  changed_when: pacemaker_pcs_netns_create.rc == 0
  when: pacemaker_netns_resource_check.rc != 0
  run_once: true
  delegate_to: "{{ pacemaker_cluster_bootstrap_node | default(pacemaker_nodes[0].name) }}"

- name: Check if NFS-Ganesha resource exists
  ansible.builtin.command:
    argv:
      - pcs
      - resource
      - show
      - ganesha_tenant_a
  register: pacemaker_ganesha_resource_check
  changed_when: false
  failed_when: false
  run_once: true
  delegate_to: "{{ pacemaker_cluster_bootstrap_node | default(pacemaker_nodes[0].name) }}"

- name: Create NFS-Ganesha resource
  ansible.builtin.command:
    argv:
      - pcs
      - resource
      - create
      - ganesha_tenant_a
      - "systemd:nfs-ganesha@{{ pacemaker_ganesha_instance | default('tenant_a') }}"
      - op
      - monitor
      - interval=10s
  register: pacemaker_pcs_ganesha_create
  changed_when: pacemaker_pcs_ganesha_create.rc == 0
  when: pacemaker_ganesha_resource_check.rc != 0
  run_once: true
  delegate_to: "{{ pacemaker_cluster_bootstrap_node | default(pacemaker_nodes[0].name) }}"

- name: Check if resource group exists
  ansible.builtin.command:
    argv:
      - pcs
      - resource
      - group
      - show
      - g_svm_tenant_a
  register: pacemaker_group_check
  changed_when: false
  failed_when: false
  run_once: true
  delegate_to: "{{ pacemaker_cluster_bootstrap_node | default(pacemaker_nodes[0].name) }}"

- name: Create resource group
  ansible.builtin.command:
    argv:
      - pcs
      - resource
      - group
      - add
      - g_svm_tenant_a
      - fs_tenant_a
      - netns_tenant_a
      - ganesha_tenant_a
  register: pacemaker_pcs_group_create
  changed_when: pacemaker_pcs_group_create.rc == 0
  when: pacemaker_group_check.rc != 0
  run_once: true
  delegate_to: "{{ pacemaker_cluster_bootstrap_node | default(pacemaker_nodes[0].name) }}"

- name: Check if order constraint exists
  ansible.builtin.command:
    argv:
      - pcs
      - constraint
      - show
      - order
      - ms_drbd_r0:promote
      - fs_tenant_a:start
  register: pacemaker_order_constraint_check
  changed_when: false
  failed_when: false
  run_once: true
  delegate_to: "{{ pacemaker_cluster_bootstrap_node | default(pacemaker_nodes[0].name) }}"

- name: Create order constraint (DRBD before Filesystem)
  ansible.builtin.command:
    argv:
      - pcs
      - constraint
      - order
      - ms_drbd_r0:promote
      - fs_tenant_a:start
  register: pacemaker_pcs_order_constraint
  changed_when: pacemaker_pcs_order_constraint.rc == 0
  when: pacemaker_order_constraint_check.rc != 0
  run_once: true
  delegate_to: "{{ pacemaker_cluster_bootstrap_node | default(pacemaker_nodes[0].name) }}"

- name: Check if colocation constraint exists
  ansible.builtin.command:
    argv:
      - pcs
      - constraint
      - show
      - colocation
      - g_svm_tenant_a
      - with
      - ms_drbd_r0:Master
  register: pacemaker_colocation_constraint_check
  changed_when: false
  failed_when: false
  run_once: true
  delegate_to: "{{ pacemaker_cluster_bootstrap_node | default(pacemaker_nodes[0].name) }}"

- name: Create colocation constraint (SVM group with DRBD)
  ansible.builtin.command:
    argv:
      - pcs
      - constraint
      - colocation
      - add
      - g_svm_tenant_a
      - with
      - ms_drbd_r0:Master
  register: pacemaker_pcs_colocation_constraint
  changed_when: pacemaker_pcs_colocation_constraint.rc == 0
  when: pacemaker_colocation_constraint_check.rc != 0
  run_once: true
  delegate_to: "{{ pacemaker_cluster_bootstrap_node | default(pacemaker_nodes[0].name) }}"
