---
- name: Configure HA storage and services
  hosts: all
  become: true
  vars:
    ansible_python_interpreter: auto_silent
  pre_tasks:
    - name: Fail fast if default secrets are used (change for production)
      ansible.builtin.assert:
        that:
          - pacemaker_hacluster_password is defined
          - pacemaker_hacluster_password != "changeme"
          - drbd_shared_secret is defined
          - drbd_shared_secret != "changeme"
        fail_msg: >-
          Default secrets detected. Set pacemaker_hacluster_password and drbd_shared_secret to non-default values
          (use ansible-vault for production).
      when: not (test_mode | default(false) | bool)
    - name: Fail fast if STONITH is disabled without explicit lab opt-out
      ansible.builtin.assert:
        that:
          - pacemaker_enable_stonith | default(false) | bool
        fail_msg: >-
          STONITH is disabled. Set pacemaker_enable_stonith=true for production,
          or set pacemaker_allow_stonith_disabled_for_lab=true only for isolated lab environments.
      when:
        - not (test_mode | default(false) | bool)
        - not (pacemaker_allow_stonith_disabled_for_lab | default(false) | bool)
  roles:
    - role: common
      tags: [common]
    - role: drbd
      tags: [drbd]
    - role: lvm
      tags: [lvm]
    - role: pacemaker
      tags: [pacemaker]
    - role: nfs-ganesha
      tags: [nfs_ganesha]
    - role: arca-cli
      tags: [arca_cli]
    - role: arca-runtime
      tags: [arca_runtime]
