# Arca Storage configuration
#
# Default path:
#   /etc/arca-storage/config.toml
#
# Override path:
#   ARCA_CONFIG_PATH=/path/to/config.toml

[storage]
vg_name = "vg_pool_01"
thinpool_name = "pool"

[network]
parent_interface = "bond0"
default_nfs_versions = ["4"]

[cluster]
pacemaker_cluster_name = "arca-cluster"
enable_stonith = true
drbd_resource = "r0"
pacemaker_ra_vendor = "local"

[api]
bind = "127.0.0.1"
port = 8080
# Optional HTTPS settings for arca-storage-api. Set both paths when binding to a
# non-loopback address instead of relying on ARCA_ALLOW_INSECURE_REMOTE_API.
# ssl_certfile = "/etc/arca-storage/tls/api.crt"
# ssl_keyfile = "/etc/arca-storage/tls/api.key"

[timeouts]
subprocess_default = 30
pacemaker_operation = 60
nfs_mount = 15

[state]
db_path = "/var/lib/arca-storage/state.db"
runtime_dir = "/var/lib/arca-storage"

[ganesha]
config_dir = "/etc/ganesha"
export_dir = "/exports"
protocols = [4]
mountd_port = 20048
nlm_port = 32768

[csi]
# Required for CSI directory-backed volumes. Set to the Kubernetes node CIDRs
# allowed to mount the SVM exports, for example ["10.0.0.0/24"].
client_cidrs = []
root_squash = true
