---
arca:
  base_url: "https://arca-api.dev.example.com"
  timeout: "30s"
  auth_type: "token"
  auth_token: ""  # Set via Secret
  tls:
    ca_cert_path: ""  # Optional: mount CA cert if using custom CA
    insecure_skip_verify: true  # Allow self-signed certs in dev

network:
  pools:
    # Development network pool
    - cidr: "192.168.100.0/24"
      range: "192.168.100.100-192.168.100.200"
      vlan: 100
      gateway: "192.168.100.1"
  mtu: 1500

driver:
  endpoint: "unix:///csi/csi.sock"
  state_file_path: "/var/lib/csi-arca-storage/node-volumes.json"
  base_mount_path: "/var/lib/kubelet/plugins/csi.arca-storage.io/mounts"
