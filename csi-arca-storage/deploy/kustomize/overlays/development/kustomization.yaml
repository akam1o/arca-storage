apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base

namespace: kube-system

images:
  - name: ghcr.io/akam1o/csi-arca-storage
    newName: csi-arca-storage
    newTag: dev  # Use local dev build

configMapGenerator:
  - name: csi-arca-storage-config
    behavior: replace
    files:
      - config.yaml

secretGenerator:
  - name: csi-arca-storage-secret
    envs:
      - secrets.env

generatorOptions:
  disableNameSuffixHash: true

labels:
  - includeSelectors: true
    pairs:
      environment: development
