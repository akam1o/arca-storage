apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base

namespace: kube-system

images:
  - name: csi-arca-storage
    newName: ghcr.io/akam1o/csi-arca-storage
    newTag: v1.0.0  # Use stable version tag

replicas:
  - name: csi-arca-storage-controller
    count: 2  # Run 2 controllers for HA

patches:
  - path: controller-patch.yaml

configMapGenerator:
  - name: csi-arca-storage-config
    behavior: replace
    files:
      - config.yaml

secretGenerator:
  - name: csi-arca-storage-secret
    behavior: replace
    envs:
      - secrets.env

labels:
  - includeSelectors: true
    pairs:
      environment: production
